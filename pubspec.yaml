name: exam_prep_pro
description: "ExamPrep Pro — first computer engineering board exam preparation app."
publish_to: "none"
version: 1.2.19+19

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  # Web-only SQLite backend (IndexedDB); lets the app run in a browser too.
  sqflite_common_ffi_web: ^1.0.0
  path: ^1.9.0
  flutter_math_fork: ^0.7.4
  flutter_highlight: ^0.7.0

  # google_mobile_ads: ^9.1.0

  supabase_flutter: ^2.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/data/images/logo_cropped.jpg
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/data/images/logo_cropped.jpg
    background_color: "#FFFFFF"
    theme_color: "#0B3D91"

flutter:
  uses-material-design: true

  # UI images only. The app ships no study content: chapters, topics,
  # theory, questions, formulas and flashcards all come from Supabase.
  assets:
    - assets/data/images/
    - assets/data/images/login_background.jpeg
